<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>PurpleStringKrafts | Products</title>

    <!-- ✅ Load Tailwind & DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css"
      rel="stylesheet"
      type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ✅ Your custom CSS -->
    <link
      href="/src/productGrid.css"
      rel="stylesheet" />
  </head>
  <body class="bg-base-100">
    <!-- ✅ Header/Navbar -->
    <section id="header">
      <div class="navbar bg-base-100 shadow-sm">
        <div class="navbar-start">
          <!-- Dropdown Menu -->
          <div class="dropdown">
            <div
              tabindex="0"
              role="button"
              class="btn btn-ghost btn-circle">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h7" />
              </svg>
            </div>
            <ul
              tabindex="0"
              class="menu menu-sm dropdown-content bg-base-100 rounded-box z-100 mt-3 w-52 p-2 shadow">
              <li><a href="homepage.html">Home</a></li>
              <li><a href="product.html">Products</a></li>
              <li><a href="contactus.html">Contact Us</a></li>
            </ul>
          </div>

          <!-- Search bar -->
          <input
            type="text"
            placeholder="Search"
            class="input input-bordered w-24 md:w-auto ml-2" />
        </div>

        <!-- Center Title -->
        <div class="navbar-center">
          <a class="btn btn-ghost normal-case text-xl">PurpleStringKrafts</a>
        </div>

        <!-- Right Icons -->
        <div class="navbar-end gap-2">
          <!-- Cart Dropdown -->
          <div class="dropdown dropdown-end">
            <div
              tabindex="0"
              role="button"
              class="btn btn-ghost btn-circle">
              <div class="indicator">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 
                    0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span class="badge badge-sm indicator-item">8</span>
              </div>
            </div>
            <div
              tabindex="0"
              class="card card-compact dropdown-content bg-base-100 z-100 mt-3 w-52 shadow">
              <div class="card-body">
                <span class="text-lg font-bold">8 Items</span>
                <span class="text-info">Subtotal: ₹999</span>
                <div class="card-actions">
                  <button
                    class="btn btn-primary btn-block"
                    onclick="location.href='cart.html'">
                    View cart
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Profile Dropdown -->
          <div class="dropdown dropdown-end">
            <div
              tabindex="0"
              role="button"
              class="btn btn-ghost btn-circle avatar">
              <div class="w-10 rounded-full">
                <img
                  alt="Profile"
                  src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp" />
              </div>
            </div>
            <ul
              tabindex="0"
              class="menu menu-sm dropdown-content bg-base-100 rounded-box z-100 mt-3 w-52 p-2 shadow">
              <li>
                <a
                  href="profile.html"
                  class="justify-between">
                  Profile
                  <span class="badge">New</span>
                </a>
              </li>
              <li><a href="index.html">Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <!-- ✅ Content Section -->
    <section id="content">
      <div
        class="min-h-screen bg-cover bg-center"
        style="
          background-image: url(./public/images/yarn.webp);">
        <div class="hero-overlay"></div>
        <div class="container mx-auto p-10 bg-base-100 bg-opacity-90 rounded-lg shadow-lg">
          <h1 class="text-3xl font-bold mb-6 text-center text-primary">
            🛍️ Product Listing
          </h1>

          <!-- Filters -->
          <div class="filters flex flex-wrap gap-4 justify-center mb-6">
            <div class="filter-group">
              <label class="font-medium">Category:</label>
              <select
                id="categoryFilter"
                class="select select-bordered ml-2">
                <option value="all">All</option>
                <option value="crochet">Crochet</option>
                <option value="print">Print</option>
                <option value="miscellanous">Miscellanous</option>
              </select>
            </div>

            <div class="filter-group">
              <label class="font-medium">Price:</label>
              <select
                id="priceFilter"
                class="select select-bordered ml-2">
                <option value="all">All</option>
                <option value="0-50">Under PHP50</option>
                <option value="50-100">₹50 - PHP100</option>
                <option value="100-9999">Above PHP100</option>
              </select>
            </div>

            <div class="filter-group">
              <label class="font-medium">Sort By:</label>
              <select
                id="sortBy"
                class="select select-bordered ml-2">
                <option value="default">Default</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="rating">Rating</option>
              </select>
            </div>
          </div>

          <!-- Product Grid -->
          <div
            id="productGrid"
            class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
        </div>
      </div>
    </section>

    <!-- ✅ Footer -->
    <footer
      class="footer sm:footer-horizontal bg-base-200 text-base-content p-10">
      <nav>
        <h6 class="footer-title">Services</h6>
        <a class="link link-hover">Branding</a>
        <a class="link link-hover">Design</a>
        <a class="link link-hover">Marketing</a>
        <a class="link link-hover">Advertisement</a>
      </nav>
      <nav>
        <h6 class="footer-title">Company</h6>
        <a class="link link-hover">About us</a>
        <a class="link link-hover">Contact</a>
        <a class="link link-hover">Jobs</a>
        <a class="link link-hover">Press kit</a>
      </nav>
      <nav>
        <h6 class="footer-title">Legal</h6>
        <a class="link link-hover">Terms of use</a>
        <a class="link link-hover">Privacy policy</a>
        <a class="link link-hover">Cookie policy</a>
      </nav>
      <form>
        <h6 class="footer-title">Newsletter</h6>
        <fieldset class="w-80">
          <label>Enter your email address</label>
          <div class="join">
            <input
              type="email"
              placeholder="username@site.com"
              class="input input-bordered join-item" />
            <button
              type="button"
              class="btn btn-primary join-item">
              Subscribe
            </button>
          </div>
        </fieldset>
      </form>
    </footer>

    <!-- ✅ Scripts at bottom -->
    <script
      type="module"
      src="/src/productGrid.js"></script>
  </body>
</html>
