<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <link
      href="/src/style.css"
      rel="stylesheet" />
  </head>
  <body>
    <style></style>

    <div class="hero bg-base-200 min-h-screen">
      <div class="hero-content flex-col lg:flex-row-reverse">
        <div class="carousel rounded-box w-100">
          <div class="carousel-item w-full">
            <img
              src="https://img.daisyui.com/images/stock/photo-1559703248-dcaaec9fab78.webp"
              class="w-full"
              alt="Tailwind CSS Carousel component" />
          </div>
          <div class="carousel-item w-full">
            <img
              src="https://img.daisyui.com/images/stock/photo-1565098772267-60af42b81ef2.webp"
              class="w-full"
              alt="Tailwind CSS Carousel component" />
          </div>
          <div class="carousel-item w-full">
            <img
              src="https://img.daisyui.com/images/stock/photo-1572635148818-ef6fd45eb394.webp"
              class="w-full"
              alt="Tailwind CSS Carousel component" />
          </div>
          <div class="carousel-item w-full">
            <img
              src="https://img.daisyui.com/images/stock/photo-1494253109108-2e30c049369b.webp"
              class="w-full"
              alt="Tailwind CSS Carousel component" />
          </div>
          <div class="carousel-item w-full">
            <img
              src="https://img.daisyui.com/images/stock/photo-1550258987-190a2d41a8ba.webp"
              class="w-full"
              alt="Tailwind CSS Carousel component" />
          </div>
          <div class="carousel-item w-full">
            <img
              src="https://img.daisyui.com/images/stock/photo-1559181567-c3190ca9959b.webp"
              class="w-full"
              alt="Tailwind CSS Carousel component" />
          </div>
          <div class="carousel-item w-full">
            <img
              src="https://img.daisyui.com/images/stock/photo-1601004890684-d8cbf643f5f2.webp"
              class="w-full"
              alt="Tailwind CSS Carousel component" />
          </div>
        </div>
        <div>
          <div class="hero bg-base-200 min-h-screen">
            <div class="hero-content flex-row lg:flex-col gap-0">
              <div
                class="text-center lg:text-left bg-base p-6 rounded-2xl shadow w-80 mb-0">
                <h1 class="text-5xl font-bold">Welcome Back!</h1>
                <p class="py-2">
                  You are one step closer to browse through designs of Purple
                  String Website type shit.
                </p>
              </div>
              <div
                class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mt-0">
                <div class="card-body">
                  <fieldset class="fieldset">
                    <label class="label">Email</label>
                    <input
                      type="email"
                      class="input"
                      placeholder="Email" />
                    <label class="label">Password</label>
                    <input
                      type="password"
                      class="input"
                      placeholder="Password" />
                    <div><a class="link link-hover">Forgot password?</a></div>
                    <button
                      class="btn btn-neutral mt-4"
                      onclick="window.location.href='homepage.html' ">
                      Login
                    </button>
                    <button
                      class="btn bg-white text-black border-[#e5e5e5]"
                      onclick="window.location.href='homepage.html' ">
                      <svg
                        aria-label="Google logo"
                        width="16"
                        height="16"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 512 512">
                        <g>
                          <path
                            d="m0 0H512V512H0"
                            fill="#fff"></path>
                          <path
                            fill="#34a853"
                            d="M153 292c30 82 118 95 171 60h62v48A192 192 0 0190 341"></path>
                          <path
                            fill="#4285f4"
                            d="m386 400a140 175 0 0053-179H260v74h102q-7 37-38 57"></path>
                          <path
                            fill="#fbbc02"
                            d="m90 341a208 200 0 010-171l63 49q-12 37 0 73"></path>
                          <path
                            fill="#ea4335"
                            d="m153 219c22-69 116-109 179-50l55-54c-78-75-230-72-297 55"></path>
                        </g>
                      </svg>
                      Login with Google
                    </button>
                    <button
                      class="btn bg-[#1A77F2] text-white border-[#005fd8]"
                      onclick="window.location.href='homepage.html' ">
                      <svg
                        aria-label="Facebook logo"
                        width="16"
                        height="16"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 32 32">
                        <path
                          fill="white"
                          d="M8 12h5V8c0-6 4-7 11-6v5c-4 0-5 0-5 3v2h5l-1 6h-4v12h-6V18H8z"></path>
                      </svg>
                      Login with Facebook
                    </button>
                  </fieldset>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
