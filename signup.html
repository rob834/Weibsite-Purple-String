<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purple Crochet - Signup</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, hsl(287, 69%, 95%), #f0d8fa);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }

      .decoration {
        position: absolute;
        z-index: 0;
        border-radius: 50%;
        filter: blur(60px);
      }
      .top-left {
        top: -90px;
        left: -100px;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle at center, #e7b9f5, transparent);
      }
      .bottom-right {
        bottom: -90px;
        right: -120px;
        width: 350px;
        height: 350px;
        background: radial-gradient(circle at center, #d68ce5, transparent);
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(214, 140, 229, 0.4);
        width: 400px;
        border-top: 6px solid #d68ce5;
        position: relative;
        z-index: 1;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #a754b8;
      }
      /* Top image container layout */
      .top-images {
        width: 100%;
        display: flex;
        justify-content: space-between; /* left group stays left, right stays right */
        align-items: center;
        margin-bottom: 5px;
        padding: 0 5px;
        position: relative;
      }

      .left-imgs,
      .right-imgs {
        display: flex;
        gap: -200px; /* small space between images */
      }

      .side-img {
        width: 70px;
        height: 100px;
        object-fit: scale-down;
        border-radius: 6px;
        background-color: #ffffff;
      }

      .profile-pic {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 20px;
      }
      .profile-pic img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #d68ce5;
        margin-bottom: 10px;
      }
      .profile-pic input {
        display: none;
      }
      .upload-btn {
        background-color: #d68ce5;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.9em;
        transition: background 0.3s;
      }
      .upload-btn:hover {
        background-color: #c878dc;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #5a2c6e;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="number"],
      input[type="date"],
      select {
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #caa4db;
        border-radius: 5px;
        transition: border-color 0.3s ease;
      }

      input:focus,
      select:focus {
        border-color: #d68ce5;
        outline: none;
        box-shadow: 0 0 3px #d68ce5;
      }

      button {
        width: 100%;
        padding: 10px;
        background-color: #d68ce5;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s ease, transform 0.2s;
      }

      button:hover {
        background-color: #c878dc;
        transform: scale(1.03);
      }

      .error {
        color: red;
        font-size: 0.9em;
        margin-bottom: 10px;
      }

      label input[type="checkbox"] {
        accent-color: #d68ce5;
      }

      .footer {
        text-align: center;
        margin-top: 10px;
        font-size: 0.9em;
      }

      .footer a {
        color: #a754b8;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="decoration top-left"></div>
    <div class="decoration bottom-right"></div>

    <div class="container">
      <h2>Create Account</h2>

      <!-- Top Decorative Images -->
      <div class="top-images">
        <div class="left-imgs">
          <img src="../public/images/whiteflower.png" class="side-img" />
          <img src="../public/images/greenthread.png" class="side-img" />
          <img src="../public/images/heartbutton.png" class="side-img" />
        </div>

        <div class="right-imgs">
          <img src="../public/images/whiteflower.png" class="side-img" />
          <img src="../public/images/greenthread.png" class="side-img" />
          <img src="../public/images/heartbutton.png" class="side-img" />
        </div>
      </div>

      <div class="profile-pic">
        <img
          id="preview"
          src="../public/images/profile icon.png"
          alt="Profile Picture"
        />
        <label for="profileUpload" class="upload-btn">Upload Picture</label>
        <input type="file" id="profileUpload" accept="image/*" />
      </div>

      <form id="signupForm">
        <label for="fname">First Name</label>
        <input type="text" id="fname" placeholder="Jane" />

        <label for="lname">Last Name</label>
        <input type="text" id="lname" placeholder="Doe" />

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="18" />

        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" placeholder="+63 912 345 6789" />

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="At least 8 characters"
        />

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" />

        <label for="country">Country</label>
        <input type="text" id="country" placeholder="Philippines" />

        <label for="gender">Gender</label>
        <select id="gender">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>

        <label>
          <input type="checkbox" id="tos" /> I agree to the Terms of Service
        </label>

        <p class="error" id="errorMsg"></p>
        <button type="submit">Sign Up</button>

        <div class="footer">
          Already have an account? <a href="../index.html">Log in here</a>
        </div>
      </form>
    </div>

    <script>
      const upload = document.getElementById("profileUpload");
      const preview = document.getElementById("preview");

      upload.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
          preview.src = URL.createObjectURL(file);
        }
      });

      const form = document.getElementById("signupForm");
      const errorMsg = document.getElementById("errorMsg");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        errorMsg.textContent = "";

        const fname = document.getElementById("fname").value.trim();
        const lname = document.getElementById("lname").value.trim();
        const age = document.getElementById("age").value.trim();
        const mobile = document.getElementById("mobile").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const dob = document.getElementById("dob").value;
        const country = document.getElementById("country").value.trim();
        const gender = document.getElementById("gender").value;
        const tos = document.getElementById("tos").checked;

        if (
          !fname ||
          !lname ||
          !age ||
          !mobile ||
          !email ||
          !password ||
          !dob ||
          !country ||
          !gender
        ) {
          errorMsg.textContent = "All fields are required.";
          return;
        }
        if (isNaN(age) || age < 1) {
          errorMsg.textContent = "Please enter a valid age.";
          return;
        }
        if (!email.match(/^\S+@\S+\.\S+$/)) {
          errorMsg.textContent = "Please enter a valid email.";
          return;
        }
        if (password.length < 8) {
          errorMsg.textContent = "Password must be at least 8 characters.";
          return;
        }
        if (!tos) {
          errorMsg.textContent = "You must agree to the Terms of Service.";
          return;
        }

        alert("Signup successful! 🎉 Redirecting to login page...");
        form.reset();
        preview.src = "https://via.placeholder.com/100/ffffff/cccccc?text=+";

        setTimeout(() => {
          window.location.href = "../index.html";
        }, 1500);
      });
    </script>
  </body>
</html>
